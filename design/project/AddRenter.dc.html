<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add renter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2747C9}a:hover{color:#1A3399}
input{font-family:Inter,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #F4F5F7; font-family: Inter, system-ui, sans-serif; color: #101828; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">

  <div style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #101828"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">Add renter</h1>
  </div>

  <div style="padding: 12px 20px 8px; font-size: 13px; font-weight: 700; color: #475467; letter-spacing: 0.4px">WHO</div>
  <div style="margin: 0 16px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column">
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; font-size: 13px; color: #475467">Name<input value="Manoj Yadav" style="border: none; padding: 0; font-size: 16px; font-weight: 600; color: #101828; background: transparent"></label>
    <div style="height: 1px; background: #EAECF0"></div>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; font-size: 13px; color: #475467">WhatsApp number<input value="+91 98XXX XXXXX" inputmode="tel" style="border: none; padding: 0; font-size: 16px; font-weight: 600; color: #101828; background: transparent"></label>
    <div style="height: 1px; background: #EAECF0"></div>
    <a href="AddressPicker.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; text-decoration: none; color: #101828">
      <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #475467">Address</span><span style="font-size: 16px; font-weight: 600">AIMS G-703</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </a>
    <div style="height: 1px; background: #EAECF0"></div>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; font-size: 13px; color: #475467">Flat / floor<input value="3rd floor" style="border: none; padding: 0; font-size: 16px; font-weight: 600; color: #101828; background: transparent"></label>
  </div>

  <div style="padding: 20px 20px 8px; font-size: 13px; font-weight: 700; color: #475467; letter-spacing: 0.4px">RENT</div>
  <div style="margin: 0 16px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; font-size: 13px; color: #475467">Monthly rent<input value="₹7,000" inputmode="numeric" style="border: none; padding: 0; font-size: 16px; font-weight: 600; color: #101828; background: transparent; width: 100%"></label>
      <label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; font-size: 13px; color: #475467">Due every month on<input value="5th" style="border: none; padding: 0; font-size: 16px; font-weight: 600; color: #101828; background: transparent; width: 100%"></label>
    </div>
    <div style="height: 1px; background: #EAECF0"></div>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; font-size: 13px; color: #475467">Agreement start<input value="1 Jan 2026" style="border: none; padding: 0; font-size: 16px; font-weight: 600; color: #101828; background: transparent"></label>
    <div style="height: 1px; background: #EAECF0"></div>
    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Ask me to raise rent 10%</span><span style="font-size: 13px; color: #475467">Every 11 months · next: Dec 2026 → ₹7,700</span></span>
      <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2747C9; flex-shrink: 0">
    </label>
  </div>

  <div style="padding: 20px 20px 8px; font-size: 13px; font-weight: 700; color: #475467; letter-spacing: 0.4px">ELECTRICITY</div>
  <div style="margin: 0 16px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="padding: 4px; border-radius: 12px; background: #E4E7EC; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
      <button style="height: 44px; border-radius: 9px; border: none; background: #FFFFFF; font-size: 15px; font-weight: 700; color: #101828; box-shadow: 0 1px 2px rgba(16,24,40,0.12)">I bill them</button>
      <button style="height: 44px; border-radius: 9px; border: none; background: transparent; font-size: 15px; font-weight: 600; color: #344054">They pay directly</button>
    </div>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #475467">Starting meter reading<input value="860" inputmode="numeric" style="border: none; padding: 0; font-size: 16px; font-weight: 600; color: #101828; background: transparent"></label>
    <div style="height: 1px; background: #EAECF0"></div>
    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0 0 8px; font-size: 13px; color: #475467">Rate per unit</legend>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="radio" name="rate" style="width: 20px; height: 20px; accent-color: #2747C9">Use global rate (₹8)</label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="radio" name="rate" checked style="width: 20px; height: 20px; accent-color: #2747C9">Own rate for this renter
        <input value="₹9" aria-label="Custom rate per unit" style="margin-left: auto; width: 64px; height: 40px; border: 1px solid #D0D5DD; border-radius: 10px; text-align: center; font-size: 16px; font-weight: 700; color: #101828"></label>
      <span style="font-size: 13px; color: #475467; line-height: 1.4">Every bill for Manoj uses ₹9. Changing the global rate won't affect him.</span>
    </fieldset>
  </div>

  <div style="padding: 20px 20px 8px; font-size: 13px; font-weight: 700; color: #475467; letter-spacing: 0.4px">FIXED MONTHLY CHARGES</div>
  <div style="margin: 0 16px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; padding: 4px 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; font-size: 15px"><span>Water</span><span style="font-weight: 700">₹200</span></div>
    <div style="height: 1px; background: #EAECF0"></div>
    <button style="height: 52px; border: none; background: transparent; padding: 0; color: #2747C9; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add charge</button>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #E4E7EC">
    <a href="Main.dc.html" style="height: 56px; border-radius: 14px; background: #2747C9; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Save renter</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
