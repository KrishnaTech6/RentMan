<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose address</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2747C9}a:hover{color:#1A3399}
input{font-family:Inter,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Inter, system-ui, sans-serif; color: #101828; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">

  <div style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px">
    <a href="AddRenter.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #101828"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">Choose address</h1>
  </div>

  <fieldset style="border: none; margin: 8px 16px 0; padding: 0; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; overflow: hidden">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Address</legend>
    <sc-for list="{{addresses}}" as="a" hint-placeholder-count="6">
      <label style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; border-top: {{a.divider}}; background: {{a.bg}}; font-size: 16px; font-weight: 600">
        <input type="radio" name="addr" checked="{{a.checked}}" style="width: 22px; height: 22px; accent-color: #2747C9; flex-shrink: 0">
        <span style="flex: 1">{{a.name}}</span>
        <span style="font-size: 13px; font-weight: 500; color: #475467">{{a.count}}</span>
      </label>
    </sc-for>
  </fieldset>

  <div style="padding: 22px 20px 8px; font-size: 13px; font-weight: 700; color: #475467; letter-spacing: 0.4px">NEW ADDRESS</div>
  <div style="margin: 0 16px; display: flex; gap: 10px">
    <input aria-label="New address" placeholder="e.g. Lake Tower B9-19" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D0D5DD; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #101828">
    <button style="height: 52px; padding: 0 18px; border-radius: 12px; border: none; background: #101828; color: #FFFFFF; font-size: 15px; font-weight: 700">Add</button>
  </div>
  <span style="margin: 10px 20px 0; font-size: 13px; color: #475467; line-height: 1.4">It's added to the list and picked for this renter.</span>

  <div style="flex: 1"></div>
  <div style="padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #E4E7EC">
    <a href="AddRenter.dc.html" style="height: 56px; border-radius: 14px; background: #2747C9; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Use Park View G-7</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      { name: '12 A', count: '3 renters' },
      { name: '12 B', count: '1 renter' },
      { name: '12 C', count: '1 renter' },
      { name: 'Park View G-7', count: 'Empty', sel: true },
      { name: 'Park View I-3', count: '1 renter' },
      { name: 'Lake Tower B9-19', count: '1 renter' }
    ];
    return {
      addresses: list.map(function (a, i) {
        return {
          name: a.name,
          count: a.count,
          checked: !!a.sel,
          bg: a.sel ? '#EEF2FF' : '#FFFFFF',
          divider: i === 0 ? 'none' : '1px solid #EAECF0'
        };
      })
    };
  }
}
</script>
</body>
</html>
