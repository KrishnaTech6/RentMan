<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: Inter, system-ui, sans-serif; color: #101828; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">

      <span style="font-size: 13px; color: #475467">Ravi Kumar · Ground floor</span>
    </div>
  </div>

  <div style="margin: 8px 16px 0; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E7EC; display: flex; align-items: center; gap: 14px">

      <span style="font-size: 13px; color: #475467">Kept as proof with this bill</span>
    </div>
    <button style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #D0D5DD; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #101828">Retake</button>

  <div style="margin: 12px 16px 0; padding: 20px; border-radius: 16px; background: #FFFFFF; border: 2px solid #2747C9; display: flex; flex-direction: column; gap: 6px">
    <label for="reading" style="font-size: 14px; font-weight: 600; color: #344054">New reading</label>
    <input id="reading" value="1325" inputmode="numeric" style="border: none; outline: none; padding: 0; font-family: Inter, system-ui, sans-serif; font-size: 44px; font-weight: 800; letter-spacing: 1px; color: #101828; width: 100%; background: transparent">

  <div style="margin: 12px 16px 0; padding: 16px; border-radius: 16px; background: #EEF2FF; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="color: #344054">1325 − 1240</span><b>85 units</b></div>
    <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="color: #344054">× ₹8 per unit <span style="font-size: 13px">(global rate)</span></span><b>₹680</b></div>
    <div style="height: 1px; background: #C7D2FE"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 600">Electricity</span><span style="font-size: 24px; font-weight: 800; color: #1C2E8A">₹680</span></div>
    <span style="font-size: 13px; color: #344054">Normal for Ravi (usually 70–95 units)</span>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #E4E7EC">
    <a href="Bill.dc.html" style="height: 56px; border-radius: 14px; background: #2747C9; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Review bill</a>
  </div>
