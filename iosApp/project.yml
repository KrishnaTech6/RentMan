name: iosApp
options:
  bundleIdPrefix: com.rentman
  deploymentTarget:
    iOS: "16.0" # not yet run on iOS 16/17, only 26.3 (see ARCHITECTURE.md §0)
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rent Manager
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: Rent Manager uses the camera to photograph an electricity meter, so the reading can be read from the photo and kept as proof of it.
        # Compose Multiplatform requires this on iPhone and crashes at launch without it.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rentman.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sharedUI/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework sharedUI"
    preBuildScripts:
      - name: Build Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
